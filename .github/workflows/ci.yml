name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tooling
        run: python -m pip install build
      - name: Build distributions before installation
        run: python -m build
      - name: Install the built wheel without runtime dependencies
        run: python -c "import pathlib,subprocess,sys; p=next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable,'-m','pip','install','--no-deps',str(p)])"
      - name: Run installed-package tests in isolated import mode
        run: python -I -m unittest discover -s tests -v
      - name: Run the installed offline demo
        run: python -I -m planbench_sqlite demo --out .ci-demo
      - name: Run a complete equivalent suite
        run: python -I -m planbench_sqlite suite .ci-demo/suite-clean.json --json .ci-demo/suite-report.json --html .ci-demo/suite-report.html
      - name: Check actual source archive documents and links
        run: python scripts/check_dist.py
      - name: Falsify the source assertions in isolated copies
        run: python scripts/mutation_check.py
